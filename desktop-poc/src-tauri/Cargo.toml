[package]
name = "decks-desktop-poc"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "decks_desktop_poc"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
url = "2"
if-addrs = "0.15"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
plist = "1.10"
rusqlite = "0.37"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL", "NSAppleEventDescriptor", "NSDate", "NSError", "NSLocale", "objc2-core-services"] }
objc2-core-services = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
