# Deck3DS settings / Reglages Deck3DS
#
# This file is optional. On first launch the application shows a setup
# assistant, and writes this file for you at sdmc:/3ds/deck3ds/settings.cfg
#
# Ce fichier est facultatif. Au premier lancement, l'application affiche un
# assistant de configuration et ecrit ce fichier pour vous.

# Address of the computer running the agent.
# The agent prints it on startup. Prefer a numeric address: name resolution
# is slow on the console.
host = 192.168.1.10

# Port the agent listens on (must match server.port in config.json).
port = 38123

# Optional shared token. Must match server.token in config.json if set.
token =

# Interface language: en or fr.
language = en

# Touch feedback: 1 or 0.
sound = 1

# Dim the screen after this many seconds of inactivity. 0 disables it.
dim_delay = 45

# Set to 1 once the setup assistant has run. Delete this line to see the
# assistant again on next launch.
configured = 0
