name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  qualification:
    name: Full qualification suite
    uses: ./.github/workflows/quality.yml

  agent:
    name: Agent release assets and launchers
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-distribution
          path: agent/dist
      - name: Render immutable launchers
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          wheel="$(find dist -maxdepth 1 -name 'deck3ds-*.whl' -print -quit)"
          source_archive="$(find dist -maxdepth 1 -name 'deck3ds-*.tar.gz' -print -quit)"
          python tools/release_assets.py \
            --wheel "$wheel" \
            --source-archive "$source_archive" \
            --output release \
            --repository "$RELEASE_REPOSITORY" \
            --tag "$RELEASE_TAG"
          bash -n release/install-3decks-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-agent
          path: agent/release/*
          if-no-files-found: error

  console:
    name: Nintendo 3DS homebrew
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache 3DS packaging container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/3ds/Dockerfile
          tags: 3decks-console-packaging:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Encode the console title version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/3ds/package_version.py "$RELEASE_TAG" >> "$GITHUB_ENV"
      - run: ./build.sh all
      - uses: actions/upload-artifact@v7
        with:
          name: release-homebrew
          path: |
            3ds-app/deck3ds.3dsx
            3ds-app/deck3ds.cia
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [agent, console]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Final checksums
        working-directory: release
        shell: bash
        run: |
          rm -f SHA256SUMS.txt
          for file in *; do
            if [ -f "$file" ] && [ "$file" != "SHA256SUMS.txt" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --generate-notes \
              --notes "$(cat packaging/release-intro.md)" \
              --title "3Decks ${RELEASE_TAG#v}" \
              --repo "$REPOSITORY"
          fi
