name: Quality

on:
  workflow_call:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Shared editor and desktop webview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/frontend
      - run: pnpm api:check
        working-directory: apps/desktop/frontend
      - run: pnpm typecheck
        working-directory: apps/desktop/frontend
      - run: pnpm test:frontend
        working-directory: apps/desktop/frontend
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop

  rust:
    name: Native desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/frontend
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  console-tests:
    name: 3DS host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/test_console.sh

  console-build:
    name: Nintendo 3DS package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/console/packaging/Dockerfile
          tags: 3decks-console-packaging:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Encode console version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 apps/console/packaging/package_version.py "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - run: ./build.sh all
      - name: Verify HOME artwork and CIA structure
        run: |
          docker run --rm -v "$PWD":/repo -w /repo 3decks-console-packaging:local bash apps/console/packaging/generate_artwork.sh --check
          python3 -m unittest discover -s tools -p test_console_package.py
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-3ds
          path: |
            apps/console/deck3ds.3dsx
            apps/console/deck3ds.cia
          if-no-files-found: error

  docs:
    name: Repository documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/check_docs.py
      - run: python3 -m unittest discover -s tools -p test_check_docs.py
