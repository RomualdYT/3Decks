name: Quality

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: uv sync --locked
      - name: Check the public example for credentials and personal paths
        run: uv run --locked python tools/audit_public_config.py
      - name: Check documentation links
        run: |
          uv run --locked python ../tools/check_docs.py
          uv run --locked python -m unittest discover -s ../tools -p test_check_docs.py
      - run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI and generated TypeScript
        run: |
          uv run --locked python -m deck3ds.api.export --check ../docs/api/openapi.json
          pnpm api:check
      - run: pnpm typecheck
      - run: pnpm test:frontend
      - run: pnpm build
      - name: Check compiled modules
        shell: bash
        run: |
          for file in backend/deck3ds/api/static/assets/*.js; do
            node --input-type=module --check < "$file"
          done
      - run: uv build
      - name: Audit and install wheel outside checkout
        run: uv run --locked python tools/qualify_wheel.py
      - name: Validate release launchers
        shell: bash
        run: |
          version="$(uv run --locked deck3ds --version | awk '{print $2}')"
          wheel="$(find dist -maxdepth 1 -name 'deck3ds-*.whl' -print -quit)"
          uv run --locked python tools/release_assets.py \
            --wheel "$wheel" \
            --output build/release-smoke \
            --repository RomualdYT/3Decks \
            --tag "v$version"
          bash -n build/release-smoke/install-3decks-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: python-distribution
          path: agent/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: agent/backend/deck3ds/api/static
          if-no-files-found: error

  agent:
    name: Agent (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-distribution
          path: agent/dist
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: agent/backend/deck3ds/api/static
      - run: uv sync --locked
      - run: uv run --locked ruff check backend/deck3ds deck3ds tests tools
      - run: uv run --locked mypy
      - name: Contracts, services and real transports
        run: uv run --locked pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Installed package smoke test (no Node or source imports)
        run: uv run --locked python tools/qualify_wheel.py
      - name: Parse the Windows launcher template
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @(
            "../packaging/launchers/install-3decks-windows.ps1.in",
            "../packaging/windows/build-store-package.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build an unsigned MSIX smoke package
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "Visual C++ build tools were not found." }
          $developerShell = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          New-Item -ItemType Directory -Path build/windows -Force | Out-Null
          $source = (Resolve-Path ../packaging/windows/launcher.c).Path
          $output = (Resolve-Path build/windows).Path + "\3Decks.exe"
          $command = "`"$developerShell`" -arch=x64 -host_arch=x64 && cl.exe /nologo /O2 /DUNICODE /D_UNICODE `"$source`" /Fe:`"$output`" /link /SUBSYSTEM:WINDOWS user32.lib"
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "The Windows launcher did not compile." }

          uv export --locked --no-dev --no-emit-project --output-file build/runtime-constraints.txt
          $wheel = Get-ChildItem dist/deck3ds-*.whl | Select-Object -First 1
          $version = (& uv run --locked deck3ds --version).Split()[-1]
          ../packaging/windows/build-store-package.ps1 `
            -Wheel $wheel.FullName `
            -Constraints build/runtime-constraints.txt `
            -Launcher build/windows/3Decks.exe `
            -PackageName "RomualdYT.3Decks.Test" `
            -Publisher "CN=3Decks Test" `
            -PublisherDisplayName "3Decks" `
            -Version $version `
            -Output build/windows/3Decks-test.msix

  console:
    name: Nintendo 3DS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build with devkitPro
        run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-3ds
          path: 3ds-app/deck3ds.3dsx
          if-no-files-found: error
