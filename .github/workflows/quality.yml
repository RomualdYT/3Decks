name: Quality

on:
  push:
  pull_request:

jobs:
  agent:
    name: Agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install quality tools
        run: python -m pip install -r agent/requirements-dev.txt
      - name: Lint Python
        run: ruff check agent/deck3ds agent/tests
      - name: Check Python syntax
        run: python -m compileall -q agent/deck3ds agent/tests
      - name: Run agent tests
        run: python -m unittest discover -s agent/tests -p "test_*.py" -q
        env:
          PYTHONPATH: agent

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend modules
        shell: bash
        run: |
          for file in agent/deck3ds/ui/static/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Test frontend modules
        run: node --test agent/tests/frontend_modules.test.mjs

  console:
    name: Nintendo 3DS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with devkitPro
        run: ./build.sh
