name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: Agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install quality tools
        run: python -m pip install -r agent/requirements-dev.txt
      - name: Lint Python
        run: ruff check agent/backend/deck3ds agent/deck3ds agent/tests
      - name: Check Python syntax
        run: python -m compileall -q agent/backend/deck3ds agent/deck3ds agent/tests
      - name: Run agent tests
        run: python -m unittest discover -s agent/tests -p "test_*.py" -q
        env:
          PYTHONPATH: agent

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install frontend dependencies
        working-directory: agent
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        working-directory: agent
        run: pnpm typecheck
      - name: Run frontend tests
        working-directory: agent
        run: pnpm test:frontend
      - name: Build frontend
        working-directory: agent
        run: pnpm build
      - name: Check built frontend modules
        shell: bash
        run: |
          for file in agent/backend/deck3ds/ui/static/assets/*.js; do
            node --input-type=module --check < "$file"
          done

  console:
    name: Nintendo 3DS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build with devkitPro
        run: ./build.sh
