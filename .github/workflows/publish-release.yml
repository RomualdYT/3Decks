name: Publish qualified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing qualified draft tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish draft
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Validate version and draft state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/check_release_version.py "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - name: Recheck release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          cp release-assets/SHA256SUMS.txt /tmp/3decks-expected-sums.txt
          python3 tools/check_release_assets.py release-assets
          cmp /tmp/3decks-expected-sums.txt release-assets/SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
